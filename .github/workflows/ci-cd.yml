name: CI-CD

on:
  push:
    branches:
      - master

  workflow_dispatch:
    inputs:
      environment:
        description: "staging or prod"
        required: true
        default: "staging"

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"

      # ✅ FIX: ensures node_modules is properly created in CI
      - name: Install Lambda dependencies
        working-directory: ./lambda
        run: npm ci

      # ✅ FIX: proper packaging INCLUDING node_modules
      - name: Package Lambda
        run: |
          cd lambda
          zip -r ../health-check-lambda.zip . \
            -x "node_modules/.cache/*" \
            -x "*.git*"

      - name: Upload Lambda artifact
        uses: actions/upload-artifact@v4
        with:
          name: lambda-package
          path: health-check-lambda.zip

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform fmt
        working-directory: ./terraform
        run: terraform fmt -check -recursive

      - name: Terraform init (validation only)
        working-directory: ./terraform
        run: terraform init -backend=false

      - name: Terraform validate
        working-directory: ./terraform
        run: terraform validate

      - name: tfsec scan
        uses: aquasecurity/tfsec-action@v1.0.0
        with:
          working_directory: ./terraform
          soft_fail: true


  deploy:
    needs: ci
    runs-on: ubuntu-latest

    if: github.ref == 'refs/heads/master' || github.event_name == 'workflow_dispatch'

    env:
      AWS_REGION: eu-north-1
      ENVIRONMENT: ${{ github.event.inputs.environment || 'staging' }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Download Lambda artifact
        uses: actions/download-artifact@v4
        with:
          name: lambda-package

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      # ✅ FIX: proper backend handling
      - name: Terraform init (with backend)
        working-directory: ./terraform
        run: terraform init -reconfigure

      - name: Terraform plan
        working-directory: ./terraform
        run: terraform plan -var-file="envs/${{ env.ENVIRONMENT }}.tfvars"

      - name: Terraform apply
        working-directory: ./terraform
        run: terraform apply -auto-approve -var-file="envs/${{ env.ENVIRONMENT }}.tfvars"
